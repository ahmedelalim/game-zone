<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>ركن الألعاب | Game Corner</title>
<link rel="icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@600;700;800&family=Cairo:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --blue:#00609e;
    --red:#c91229;
    --white:#fdfeff;
    --shadow: rgba(0,0,0,.25);
    --panel: rgba(253,254,255,.10);
    --panel-strong: rgba(253,254,255,.18);
    --green-success: #2ecc71;
  }

  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

  html,body{ height:100%; margin:0; }

  body{
    display:flex; flex-direction:column;
    background:var(--blue); color:var(--white);
    font-family:'Cairo',system-ui,sans-serif;
    overflow:hidden; overscroll-behavior:none; user-select:none;
  }

  h1,h2,.display{ font-family:'Baloo Bhaijaan 2','Cairo',system-ui,sans-serif; }

  button{ font-family:inherit; }
  button:focus-visible{ outline:4px solid var(--white); outline-offset:3px; }

  /* Utility classes for translations */
  .sub-en {
    display: block;
    font-size: 0.65em;
    font-weight: 500;
    opacity: 0.85;
    direction: ltr;
    unicode-bidi: isolate;
  }

  /* ---------- header ---------- */
  .logo-bar{
    flex:0 0 auto;
    display:flex; align-items:center; justify-content:center;
    padding: clamp(8px,2vh,20px) 0 clamp(4px,1vh,10px);
  }
  .logo-bar img{
    width: clamp(100px,22vw,180px);
    height:auto;
    filter: drop-shadow(0 6px 14px var(--shadow));
  }

  /* ---------- app / views ---------- */
  #app{ position:relative; flex:1 1 auto; overflow:hidden; }
  .view{
    position:absolute; inset:0;
    display:none; flex-direction:column; align-items:center; justify-content:center;
    padding: 2vh 4vw; gap: clamp(10px,2vh,20px);
    animation: rise .35s ease both;
  }
  .view.active{ display:flex; }
  @keyframes rise{ from{ opacity:0; transform:translateY(14px);} to{ opacity:1; transform:none;} }
  @media (prefers-reduced-motion: reduce){ .view{ animation:none; } }

  .back-btn{
    position:absolute; top: 2vh; inset-inline-start: 4vw;
    background:var(--panel-strong); color:var(--white);
    border:none; border-radius:14px;
    padding: 10px 18px; font-size:1rem; font-weight:700;
    cursor:pointer; text-align: center; z-index: 10;
  }
  .back-btn:active{ background:var(--panel); }

  .fullscreen-btn{
    position:absolute; top:2vh; inset-inline-end:4vw;
    background:transparent; color:var(--white);
    border:2px solid var(--panel-strong); border-radius:12px;
    padding:8px 12px; font-size:.9rem; font-weight:700;
    cursor:pointer; opacity:.85; text-align: center; z-index: 10;
  }

  /* ---------- home ---------- */
  #home h1{ font-size: clamp(1.6rem,4vw,2.2rem); margin:0; text-align:center; }
  #home .subtitle{ margin:0 0 .5rem; opacity:.85; font-weight:500; text-align:center; font-size: clamp(.85rem,2vw,1.05rem); }

  /* 2x2 Square Grid Configuration */
  .menu{ 
    display:grid; 
    grid-template-columns: repeat(2, 1fr); 
    grid-template-rows: repeat(2, 1fr); 
    gap: clamp(12px, 2.5vw, 20px); 
    width: 100%; 
    max-width: min(85vw, 550px);
    aspect-ratio: 1 / 1;
  }

  .tile{
    position:relative;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap: 8px;
    background:var(--red); color:var(--white);
    border:none; border-radius:24px;
    padding: 12px;
    text-align:center; cursor:pointer;
    box-shadow: 0 8px 0 rgba(0,0,0,.22);
    transition: transform .08s ease, box-shadow .08s ease;
    width: 100%;
    height: 100%;
  }
  .tile:active{ transform:translateY(6px); box-shadow:0 2px 0 rgba(0,0,0,.22); }

  .tile-icon{
    flex:0 0 auto; 
    width: clamp(42px, 8vw, 60px); 
    height: clamp(42px, 8vw, 60px);
    display:grid; place-items:center;
    background:var(--panel-strong); border-radius:16px;
    font-size: clamp(1.4rem, 3vw, 2rem);
  }
  .tile-text .display{ font-size: clamp(1.05rem, 2.2vw, 1.3rem); font-weight:800; line-height:1.1; display:block; }
  .tile-text p{ margin:.2rem 0 0; font-size: clamp(.7rem, 1.4vw, .85rem); opacity:.9; font-weight:500; line-height: 1.2; }

  /* Position domino pips nicely in top right corner of each square */
  .pips{ 
    position: absolute;
    top: 12px;
    inset-inline-end: 14px;
    display:flex; gap:4px; flex:0 0 auto; 
  }
  .pips span{ width:7px; height:7px; border-radius:50%; background:var(--white); opacity:.85; }

  /* ---------- status / restart shared ---------- */
  .status{ font-size: clamp(1.2rem,3.5vw,2rem); font-weight:800; text-align:center; min-height:1.5em; }
  .restart-btn{
    background:var(--red); color:var(--white); border:none; border-radius:16px;
    padding:clamp(12px,1.8vh,20px) clamp(22px,4vw,40px); font-size:clamp(1rem,2.5vw,1.5rem); font-weight:800; cursor:pointer;
    box-shadow:0 5px 0 rgba(0,0,0,.22); text-align: center;
  }
  .restart-btn:active{ transform:translateY(3px); box-shadow:0 2px 0 rgba(0,0,0,.22); }

  /* ---------- tic tac toe ---------- */
  .xo-board{
    display:grid; grid-template-columns:repeat(3,1fr); grid-template-rows:repeat(3,1fr); gap:2vw;
    width:min(92%,75vh); aspect-ratio:1;
  }
  .xo-cell{
    background:var(--panel-strong); border-radius:18px;
    display:flex; align-items:center; justify-content:center;
    font-family:'Baloo Bhaijaan 2',system-ui; font-size:min(15vw,8rem); font-weight:800;
    cursor:pointer; color:var(--white);
    min-width:0; min-height:0; overflow:hidden;
    border:4px dashed transparent;
  }
  .xo-cell.x{ color:var(--white); }
  .xo-cell.o{ color:var(--red); -webkit-text-stroke: 2px var(--white); }
  .xo-cell.win{ border-color:var(--red); background:var(--panel); }

  /* ---------- connect four ---------- */
  .c4-board{
    display:grid; grid-template-columns:repeat(7,1fr); gap: 1.4vw;
    background:var(--panel); padding: 1.4vw; border-radius:20px;
    width:min(92%,80vh); aspect-ratio:7/6;
  }
  .c4-cell{ background:var(--panel-strong); border-radius:50%; cursor:pointer; min-width:0; min-height:0; border:4px dashed transparent; }
  .c4-cell.p1{ background:var(--red); }
  .c4-cell.p2{ background:var(--white); }
  .c4-cell.win.p1{ border-color:var(--white); }
  .c4-cell.win.p2{ border-color:var(--red); }

  /* ---------- tug of war ---------- */
  .tug-wrap{ width:100%; max-width:min(92%,1200px); display:flex; flex-direction:column; align-items:center; gap:clamp(14px,2.5vh,30px); flex:1; justify-content:center; }
  .tug-meter{ width:100%; height:clamp(28px,4.5vh,60px); background:var(--panel); border-radius:20px; position:relative; overflow:hidden; border:2px solid var(--panel-strong); }
  .tug-marker{
    position:absolute; top:-3px; bottom:-3px; left:50%; width:clamp(14px,1.6vw,28px);
    background:var(--white); border-radius:10px; transform:translateX(-50%);
    box-shadow:0 0 0 4px var(--panel-strong);
  }
  .tug-zones{ display:flex; gap:16px; width:100%; flex:1; min-height:0; }
  .tug-zone{
    flex:1; border:none; border-radius:24px;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    font-family:'Baloo Bhaijaan 2',system-ui; font-size:clamp(1.2rem,4.5vw,2.6rem); font-weight:800; line-height:1.3;
    color:var(--white); cursor:pointer;
  }
  .tug-zone.p1{ background:var(--red); }
  .tug-zone.p2{ background:transparent; border:3px solid var(--white); }
  .tug-zone:active{ filter:brightness(1.12); }
  .tug-result{ font-size:clamp(1.2rem,3.5vw,1.7rem); font-weight:800; min-height:1.4em; text-align:center; }

  /* ---------- timer challenge ---------- */
  .timer-box {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: var(--panel-strong);
    padding: 20px 30px;
    border-radius: 28px;
    border: 3px solid var(--panel);
    width: min(90%, 450px);
    box-shadow: inset 0 0 20px rgba(0,0,0,0.15);
    transition: all 0.3s ease;
  }
  .target-badge {
    background: rgba(0,0,0,0.25);
    padding: 6px 18px;
    border-radius: 12px;
    font-size: 1rem;
    font-weight: 700;
    margin-bottom: 6px;
    border: 1px solid rgba(255,255,255,0.15);
  }
  .target-badge span {
    color: #ffda79;
    font-family: monospace, sans-serif;
    font-size: 1.15em;
  }
  .timer-display {
    font-size: clamp(3.2rem, 11vw, 5rem);
    font-weight: 800;
    font-family: monospace, sans-serif;
    letter-spacing: 2px;
    line-height: 1;
    margin: 5px 0 10px;
  }
  .timer-btn {
    background: var(--red);
    color: var(--white);
    border: none;
    border-radius: 20px;
    padding: 14px 36px;
    font-size: 1.4rem;
    font-weight: 800;
    cursor: pointer;
    box-shadow: 0 6px 0 rgba(0,0,0,.22);
    transition: transform .08s ease, background-color .3s ease;
  }
  .timer-btn:active { transform: translateY(3px); box-shadow:0 2px 0 rgba(0,0,0,.22); }
  
  .timer-box.success {
    background: rgba(46, 204, 113, 0.25);
    border-color: var(--green-success);
    box-shadow: 0 0 35px var(--green-success);
  }
  .timer-box.success .timer-display {
    color: #2ecc71;
    text-shadow: 0 0 15px rgba(46, 204, 113, 0.6);
  }
  .timer-box.error {
    background: rgba(201, 18, 41, 0.35);
    border-color: var(--red);
    box-shadow: 0 0 25px var(--red);
  }
</style>
</head>
<body>

<header class="logo-bar">
  <img src="logo.png" alt="شعار الشركة | Company Logo">
</header>

<main id="app">

  <section id="home" class="view active">
    <button class="fullscreen-btn" id="fs-btn">
      ⛶ ملء الشاشة
      <span class="sub-en">Full Screen</span>
    </button>
    <h1>
      <span class="display">اختر لعبة</span>
      <span class="sub-en">Choose a Game</span>
    </h1>
    <p class="subtitle">
      اضغط على لعبة لتبدأ اللعب فورًا
      <span class="sub-en">Tap a game to play immediately</span>
    </p>

    <div class="menu">
      <button class="tile" data-game="xo">
        <span class="pips"><span></span></span>
        <span class="tile-icon">✕⭘</span>
        <span class="tile-text">
          <span class="display">إكس أو</span>
          <span class="sub-en">Tic Tac Toe</span>
          <p>ثلاثة متتالية تفوز<span class="sub-en">Get 3 in a row</span></p>
        </span>
      </button>
      
      <button class="tile" data-game="c4">
        <span class="pips"><span></span><span></span></span>
        <span class="tile-icon">🔴</span>
        <span class="tile-text">
          <span class="display">أربعة متصلة</span>
          <span class="sub-en">Connect Four</span>
          <p>رتب أربعة لتفوز<span class="sub-en">Connect 4 to win</span></p>
        </span>
      </button>

      <button class="tile" data-game="tug">
        <span class="pips"><span></span><span></span><span></span></span>
        <span class="tile-icon">💪</span>
        <span class="tile-text">
          <span class="display">شد الحبل</span>
          <span class="sub-en">Tug of War</span>
          <p>اضغط أسرع واسحب<span class="sub-en">Tap faster & pull</span></p>
        </span>
      </button>

      <button class="tile" data-game="timer">
        <span class="pips"><span></span><span></span><span></span><span></span></span>
        <span class="tile-icon">⏱️</span>
        <span class="tile-text">
          <span class="display">تحدي الـ 10 ثواني</span>
          <span class="sub-en">10s Challenge</span>
          <p>أوقف عند 10.00<span class="sub-en">Stop at 10.00</span></p>
        </span>
      </button>
    </div>
  </section>

  <section id="game-xo" class="view">
    <button class="back-btn" data-back>رجوع <span class="sub-en">Back</span></button>
    <div class="status" id="xo-status"></div>
    <div class="xo-board" id="xo-board"></div>
    <button class="restart-btn" id="xo-restart">العب مرة أخرى <span class="sub-en">Play Again</span></button>
  </section>

  <section id="game-c4" class="view">
    <button class="back-btn" data-back>رجوع <span class="sub-en">Back</span></button>
    <div class="status" id="c4-status"></div>
    <div class="c4-board" id="c4-board"></div>
    <button class="restart-btn" id="c4-restart">العب مرة أخرى <span class="sub-en">Play Again</span></button>
  </section>

  <section id="game-tug" class="view">
    <button class="back-btn" data-back>رجوع <span class="sub-en">Back</span></button>
    <div class="tug-wrap">
      <div class="status" id="tug-status">
        جاهز؟ اضغط في جهتك بأسرع ما يمكن!
        <span class="sub-en">Ready? Tap your side as fast as you can!</span>
      </div>
      <div class="tug-meter"><div class="tug-marker" id="tug-marker"></div></div>
      <div class="tug-zones">
        <button class="tug-zone p1" id="tug-p1">
          اللاعب 1
          <span class="sub-en">Player 1</span>
          <small style="font-size: 0.6em;">اضغط بسرعة! <span class="sub-en">Tap Fast!</span></small>
        </button>
        <button class="tug-zone p2" id="tug-p2">
          اللاعب 2
          <span class="sub-en">Player 2</span>
          <small style="font-size: 0.6em;">اضغط بسرعة! <span class="sub-en">Tap Fast!</span></small>
        </button>
      </div>
      <div class="tug-result" id="tug-result"></div>
    </div>
    <button class="restart-btn" id="tug-restart">العب مرة أخرى <span class="sub-en">Play Again</span></button>
  </section>

  <section id="game-timer" class="view">
    <button class="back-btn" data-back>رجوع <span class="sub-en">Back</span></button>
    <div class="status" id="timer-status">
      اختبر دقة ملاحظتك!
      <span class="sub-en">Test your timing precision!</span>
    </div>
    
    <div class="timer-box" id="timer-box">
      <div class="target-badge">
        الوقت المطلوب: <span>10.00s</span>
        <span class="sub-en">Target Time: <span>10.00s</span></span>
      </div>
      <div class="timer-display" id="timer-display">0.00</div>
    </div>

    <button class="timer-btn" id="timer-action-btn">
      ابدأ
      <span class="sub-en">Start</span>
    </button>
  </section>

</main>

<script>
(function(){
  "use strict";

  // ---------- view switching ----------
  function showView(id){
    document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
    document.getElementById(id).classList.add('active');
  }
  document.querySelectorAll('.tile').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const g = btn.dataset.game;
      if(g==='xo') startXO();
      if(g==='c4') startC4();
      if(g==='tug') startTug();
      if(g==='timer') startTimerGame();
    });
  });
  document.querySelectorAll('[data-back]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      if(timerInterval) clearInterval(timerInterval);
      showView('home');
    });
  });

  // ---------- fullscreen ----------
  document.getElementById('fs-btn').addEventListener('click', ()=>{
    if(!document.fullscreenElement){
      document.documentElement.requestFullscreen?.().catch(()=>{});
    } else {
      document.exitFullscreen?.().catch(()=>{});
    }
  });

  // =========================================================
  // TIC TAC TOE
  // =========================================================
  let xoBoard, xoTurn, xoActive;
  const xoBoardEl = document.getElementById('xo-board');
  const xoStatusEl = document.getElementById('xo-status');
  const XO_LINES = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];

  function startXO(){
    xoBoard = Array(9).fill(null);
    xoTurn = 'X';
    xoActive = true;
    renderXO();
    xoStatusEl.innerHTML = `دور اللاعب ${xoTurn} <span class="sub-en">Player ${xoTurn}'s Turn</span>`;
    showView('game-xo');
  }
  function renderXO(winLine){
    xoBoardEl.innerHTML = '';
    xoBoard.forEach((val,i)=>{
      const cell = document.createElement('div');
      let cls = 'xo-cell' + (val ? ' '+val.toLowerCase() : '');
      if(winLine && winLine.includes(i)) cls += ' win';
      cell.className = cls;
      cell.textContent = val || '';
      cell.addEventListener('click', ()=> xoMove(i));
      xoBoardEl.appendChild(cell);
    });
  }
  function xoResult(){
    for(const line of XO_LINES){
      const [a,b,c] = line;
      if(xoBoard[a] && xoBoard[a]===xoBoard[b] && xoBoard[a]===xoBoard[c]) return { symbol: xoBoard[a], line };
    }
    if(xoBoard.every(v=>v)) return { draw:true };
    return null;
  }
  function xoMove(i){
    if(!xoActive || xoBoard[i]) return;
    xoBoard[i] = xoTurn;
    const result = xoResult();
    if(result){
      xoActive = false;
      renderXO(result.line);
      xoStatusEl.innerHTML = result.draw ? 
        `تعادل! لعب رائع 🙌 <span class="sub-en">Draw! Great game</span>` : 
        `فاز اللاعب ${result.symbol}! 🎉 <span class="sub-en">Player ${result.symbol} Wins!</span>`;
    } else {
      xoTurn = xoTurn==='X' ? 'O' : 'X';
      renderXO();
      xoStatusEl.innerHTML = `دور اللاعب ${xoTurn} <span class="sub-en">Player ${xoTurn}'s Turn</span>`;
    }
  }
  document.getElementById('xo-restart').addEventListener('click', startXO);

  // =========================================================
  // CONNECT FOUR
  // =========================================================
  const C4_ROWS = 6, C4_COLS = 7;
  let c4Board, c4Turn, c4Active;
  const c4BoardEl = document.getElementById('c4-board');
  const c4StatusEl = document.getElementById('c4-status');

  function startC4(){
    c4Board = Array.from({length:C4_ROWS}, ()=>Array(C4_COLS).fill(null));
    c4Turn = 1;
    c4Active = true;
    renderC4();
    c4StatusEl.innerHTML = `دور اللاعب 1 <span class="sub-en">Player 1's Turn</span>`;
    showView('game-c4');
  }
  function renderC4(newPos, winCells){
    c4BoardEl.innerHTML = '';
    let newCellEl = null, topCellEl = null;
    for(let r=0;r<C4_ROWS;r++){
      for(let c=0;c<C4_COLS;c++){
        const cell = document.createElement('div');
        const val = c4Board[r][c];
        let cls = 'c4-cell' + (val ? ' p'+val : '');
        if(winCells && winCells.some(([wr,wc])=> wr===r && wc===c)) cls += ' win';
        cell.className = cls;
        cell.addEventListener('click', ()=> c4Move(c));
        c4BoardEl.appendChild(cell);
        if(newPos && r===newPos.row && c===newPos.col) newCellEl = cell;
        if(newPos && r===0 && c===newPos.col) topCellEl = cell;
      }
    }
    if(newCellEl && topCellEl && newCellEl!==topCellEl){
      const delta = topCellEl.getBoundingClientRect().top - newCellEl.getBoundingClientRect().top;
      newCellEl.style.transition = 'none';
      newCellEl.style.transform = `translateY(${delta}px)`;
      newCellEl.getBoundingClientRect();
      requestAnimationFrame(()=>{
        newCellEl.style.transition = 'transform .38s cubic-bezier(.35,.85,.4,1.15)';
        newCellEl.style.transform = 'translateY(0)';
      });
    }
  }
  function c4DropRow(col){
    for(let r=C4_ROWS-1;r>=0;r--){ if(!c4Board[r][col]) return r; }
    return -1;
  }
  function c4WinCells(row,col){
    const player = c4Board[row][col];
    const dirs = [[0,1],[1,0],[1,1],[1,-1]];
    for(const [dr,dc] of dirs){
      const cells = [[row,col]];
      let r=row+dr, c=col+dc;
      while(r>=0 && r<C4_ROWS && c>=0 && c<C4_COLS && c4Board[r][c]===player){ cells.push([r,c]); r+=dr; c+=dc; }
      r=row-dr; c=col-dc;
      while(r>=0 && r<C4_ROWS && c>=0 && c<C4_COLS && c4Board[r][c]===player){ cells.push([r,c]); r-=dr; c-=dc; }
      if(cells.length>=4) return cells;
    }
    return null;
  }
  function c4IsFull(){ return c4Board.every(row=>row.every(v=>v)); }
  function c4Move(col){
    if(!c4Active) return;
    const row = c4DropRow(col);
    if(row===-1) return;
    c4Board[row][col] = c4Turn;
    const winCells = c4WinCells(row,col);
    renderC4({row,col}, winCells);
    if(winCells){
      c4Active = false;
      c4StatusEl.innerHTML = `فاز اللاعب ${c4Turn}! 🎉 <span class="sub-en">Player ${c4Turn} Wins!</span>`;
    } else if(c4IsFull()){
      c4Active = false;
      c4StatusEl.innerHTML = `تعادل! لعب رائع 🙌 <span class="sub-en">Draw! Great game</span>`;
    } else {
      c4Turn = c4Turn===1 ? 2 : 1;
      c4StatusEl.innerHTML = `دور اللاعب ${c4Turn} <span class="sub-en">Player ${c4Turn}'s Turn</span>`;
    }
  }
  document.getElementById('c4-restart').addEventListener('click', startC4);

  // =========================================================
  // TUG OF WAR
  // =========================================================
  let tugValue, tugActive;
  const tugMarker = document.getElementById('tug-marker');
  const tugResult = document.getElementById('tug-result');
  const tugStatus = document.getElementById('tug-status');
  const TUG_STEP = 3.5;

  function startTug(){
    tugValue = 50;
    tugActive = true;
    tugResult.textContent = '';
    tugStatus.innerHTML = 'جاهز؟ اضغط في جهتك بأسرع ما يمكن! <span class="sub-en">Ready? Tap your side as fast as you can!</span>';
    updateTugMarker();
    showView('game-tug');
  }
  function updateTugMarker(){ tugMarker.style.left = (100 - tugValue) + '%'; }
  function tugTap(player){
    if(!tugActive) return;
    tugValue += (player===1 ? -TUG_STEP : TUG_STEP);
    tugValue = Math.max(0, Math.min(100, tugValue));
    updateTugMarker();
    if(tugValue<=0 || tugValue>=100){
      tugActive = false;
      const winner = tugValue<=0 ? 1 : 2;
      tugStatus.textContent = '';
      tugResult.innerHTML = `فاز اللاعب ${winner}! 🎉 <span class="sub-en">Player ${winner} Wins!</span>`;
    }
  }
  document.getElementById('tug-p1').addEventListener('pointerdown', e=>{ e.preventDefault(); tugTap(1); });
  document.getElementById('tug-p2').addEventListener('pointerdown', e=>{ e.preventDefault(); tugTap(2); });
  document.getElementById('tug-restart').addEventListener('click', startTug);

  // =========================================================
  // TIMER CHALLENGE (GAME 4)
  // =========================================================
  let timerInterval = null;
  let timerStartTime = 0;
  let timerRunning = false;

  const timerDisplay = document.getElementById('timer-display');
  const timerStatus = document.getElementById('timer-status');
  const timerActionBtn = document.getElementById('timer-action-btn');
  const timerBox = document.getElementById('timer-box');

  function startTimerGame(){
    if(timerInterval) clearInterval(timerInterval);
    timerRunning = false;
    timerDisplay.textContent = '0.00';
    timerBox.className = 'timer-box';
    timerStatus.innerHTML = 'اختبر دقة ملاحظتك! <span class="sub-en">Test your timing precision!</span>';
    timerActionBtn.innerHTML = 'ابدأ <span class="sub-en">Start</span>';
    showView('game-timer');
  }

  function handleTimerClick(){
    if(!timerRunning){
      // Start Timer
      timerRunning = true;
      timerBox.className = 'timer-box';
      timerStatus.innerHTML = 'توقع الوقت بأعلى دقة... <span class="sub-en">Precision is key...</span>';
      timerActionBtn.innerHTML = 'توقيف <span class="sub-en">Stop</span>';
      timerStartTime = Date.now();
      
      timerInterval = setInterval(()=>{
        const elapsed = (Date.now() - timerStartTime) / 1000;
        timerDisplay.textContent = elapsed.toFixed(2);
      }, 10);
    } else {
      // Stop Timer
      clearInterval(timerInterval);
      timerRunning = false;
      const finalTime = ((Date.now() - timerStartTime) / 1000).toFixed(2);
      timerDisplay.textContent = finalTime;
      timerActionBtn.innerHTML = 'حاول مرة أخرى <span class="sub-en">Try Again</span>';

      if(finalTime === "10.00"){
        timerBox.className = 'timer-box success';
        timerStatus.innerHTML = 'ممتاز! توقيت مثالي بـ 10.00 ثوانٍ! 🎯🎉 <span class="sub-en">Perfect! Exactly 10.00 seconds!</span>';
      } else {
        timerBox.className = 'timer-box error';
        timerStatus.innerHTML = `توقيت خاطئ (${finalTime} ث)! حاول مجدداً ❌ <span class="sub-en">Wrong Time (${finalTime}s)! Try again</span>`;
      }
    }
  }

  timerActionBtn.addEventListener('click', handleTimerClick);

})();
</script>
</body>
</html>
